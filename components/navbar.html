<header class="topbar">
    <div class="topbar-left">
        <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
        <span class="topbar-title" id="page-title">Dashboard</span>
        <span class="topbar-sync-indicator" id="topbar-sync-indicator" title="Time since this module's data was last loaded">
            <span class="sync-dot" aria-hidden="true"></span><span id="topbar-sync-text">Updated just now</span>
        </span>
    </div>

    <div class="topbar-right">
        <span class="topbar-user" id="topbar-user-name">-</span>
        <span class="topbar-role" id="topbar-user-role">-</span>
        <button class="logout-btn animated-logout-btn" data-logout type="button" aria-label="Logout">
            <span class="logout-text">Log Out</span>
            <span class="logout-animation" aria-hidden="true">
                <span class="logout-figure"></span>
                <span class="logout-doorway"></span>
                <span class="logout-door"></span>
            </span>
        </button>
    </div>
</header>
