<div class="login-screen creative-login-screen">
    <div class="login-shell">
        <section class="login-visual-panel" aria-hidden="true">
            <div class="login-brand-block">
                <img src="https://i.ibb.co/FLnH6Fw2/1cf98fc6-5c25-4af8-8af0-1e556340272f.jpg" class="login-company-logo" alt="Toledo">
                <div>
                    <div class="login-logo-word">TOLEDO</div>
                    <div class="login-system-name">Operation System</div>
                </div>
            </div>

            <div class="login-door-scene">
                <div class="login-speed-lines line-1"></div>
                <div class="login-speed-lines line-2"></div>
                <div class="login-speed-lines line-3"></div>
                <div class="login-portal-glow"></div>
                <div class="login-door-frame">
                    <div class="login-door">
                        <div class="door-logo-mark">
                            <span>TOLEDO</span>
                            <small>Operation System</small>
                        </div>
                        <span class="door-handle"></span>
                    </div>
                </div>
                <div class="login-runner">
                    <span class="runner-head"></span>
                    <span class="runner-body"></span>
                    <span class="runner-arm arm-left"></span>
                    <span class="runner-arm arm-right"></span>
                    <span class="runner-leg leg-left"></span>
                    <span class="runner-leg leg-right"></span>
                </div>
            </div>

            <div class="login-tagline">
                <span>Smart Systems.</span>
                <strong>Better Performance.</strong>
            </div>
        </section>

        <section class="login-card creative-login-card">
            <div class="login-card-header">
                <img src="https://i.ibb.co/FLnH6Fw2/1cf98fc6-5c25-4af8-8af0-1e556340272f.jpg" class="login-card-logo" alt="Toledo">
                <div>
                    <div class="login-logo">TOLEDO</div>
                    <p class="login-sub">Operation System</p>
                </div>
            </div>

            <h1 class="login-title">Welcome <span>Back</span></h1>
            <p class="login-description">Sign in to continue to Toledo Operation System</p>

            <form id="login-form" class="login-form creative-login-form">
                <label for="login-username">Username or Email</label>
                <div class="login-field">
                    <span class="field-icon">♙</span>
                    <input id="login-username" type="text" autocomplete="username" placeholder="Username or Email" required>
                </div>

                <label for="login-password">Password</label>
                <div class="login-field">
                    <span class="field-icon">▣</span>
                    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required>
                    <button type="button" class="password-eye" aria-label="Show password">◉</button>
                </div>

                <div class="login-options-row">
                    <label class="remember-row">
                        <input type="checkbox" id="login-remember">
                        <span>Remember me</span>
                    </label>
                    <button type="button" class="forgot-link">Forgot Password?</button>
                </div>

                <p id="login-error" class="login-error hidden"></p>

                <button type="submit" id="login-submit" class="btn btn-primary btn-block creative-login-btn">
                    <span>Log In</span>
                    <span class="login-btn-animation" aria-hidden="true">
                        <span class="btn-runner"></span>
                        <span class="btn-door"></span>
                    </span>
                </button>
            </form>

            <div class="login-divider"><span>Secure access</span></div>
            <p class="login-footer-note">© 2026 Toledo Developments. All rights reserved.</p>
        </section>
    </div>
</div>
