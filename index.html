<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation System</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- ستايل شاشة التحميل مكتوب inline هنا (مش في ملف الثيم) عشان
         يتطبق فورًا من أول رسمة للصفحة، قبل ما الجافاسكريبت يشتغل
         ويحمّل ملف الثيم ديناميكيًا. كده مفيش "ومضة" شكل بايظ. -->
    <style>
      :root{--boot-accent:#d6ad55;--boot-bg:#0b1018;--boot-wall:#151e2b;--boot-text:#f5f7fa}
      html[data-theme="light"],html[data-theme="odoo"],html[data-theme="oracle"],html[data-theme="sap"]{--boot-bg:#eef2f6;--boot-wall:#dde5ed;--boot-text:#17202c}
      #bootLoader{position:fixed;inset:0;z-index:999999;overflow:hidden;background:linear-gradient(160deg,var(--boot-bg),var(--boot-wall));color:var(--boot-text);transition:opacity .5s,visibility .5s}
      #bootLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}.workday-scene{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;overflow:hidden}
      .workday-sky{position:absolute;inset:0 0 38%;background:linear-gradient(#87c7ef,#dcefff);opacity:.92}.workday-city{position:absolute;left:0;right:0;bottom:38%;height:28%;background:linear-gradient(90deg,#8495a8 8%,transparent 8% 11%,#6f8194 11% 24%,transparent 24% 28%,#91a0af 28% 43%,transparent 43% 48%,#718397 48% 68%,transparent 68% 72%,#8c9cab 72%);opacity:.4}
      .workday-office{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent),var(--boot-wall);border-top:1px solid rgba(255,255,255,.12)}
      .workday-door{position:absolute;right:9vw;bottom:7vh;width:150px;height:260px;border:10px solid rgba(0,0,0,.2);background:#273547;transform-origin:right;animation:bootDoor 2.8s ease-in-out infinite}.workday-door:after{content:"";position:absolute;left:18px;top:118px;width:10px;height:10px;border-radius:50%;background:var(--boot-accent)}
      .tired-worker{position:absolute;left:-110px;bottom:9vh;width:86px;height:190px;animation:walkToWork 4.6s cubic-bezier(.45,.02,.2,1) infinite}.tired-worker .head{position:absolute;left:27px;top:0;width:36px;height:36px;border-radius:50%;background:#d8b08a;box-shadow:0 5px 0 #30353c}.tired-worker .body{position:absolute;left:18px;top:36px;width:52px;height:94px;border-radius:22px 22px 10px 10px;background:#33485f;transform:rotate(5deg)}.tired-worker .leg{position:absolute;top:122px;width:18px;height:64px;background:#24313f;border-radius:10px;transform-origin:top}.tired-worker .leg.a{left:22px;animation:legA .65s ease-in-out infinite alternate}.tired-worker .leg.b{left:50px;animation:legB .65s ease-in-out infinite alternate}.tired-worker .bag{position:absolute;left:-8px;top:70px;width:44px;height:52px;border:4px solid #7f5b31;border-radius:7px;background:#553b24;transform:rotate(8deg);animation:bagSwing .7s ease-in-out infinite alternate}.tired-worker .bag:before{content:"";position:absolute;left:7px;right:7px;top:-19px;height:20px;border:3px solid #7f5b31;border-bottom:0;border-radius:12px 12px 0 0}
      .boot-caption{position:relative;z-index:3;align-self:end;margin:0 auto 5vh;width:min(560px,88vw);padding:18px 22px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(10,17,27,.62);backdrop-filter:blur(16px);text-align:center;color:#fff}.boot-caption strong{display:block;font:700 18px Inter,sans-serif}.boot-caption small{display:block;margin-top:5px;color:rgba(255,255,255,.68)}.boot-progress{height:4px;margin-top:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.1)}.boot-progress i{display:block;height:100%;width:14%;background:var(--boot-accent);transition:width .4s}
      @keyframes walkToWork{0%{left:-110px;transform:translateY(0) rotate(-2deg)}75%{left:calc(91vw - 120px);transform:translateY(3px) rotate(2deg)}100%{left:calc(91vw - 105px);opacity:.15}}@keyframes bootDoor{0%,58%{transform:perspective(700px) rotateY(0)}76%,100%{transform:perspective(700px) rotateY(-62deg)}}@keyframes legA{to{transform:rotate(20deg)}}@keyframes legB{to{transform:rotate(-20deg)}}@keyframes bagSwing{to{transform:rotate(-7deg)}}
      @media(max-width:650px){.workday-door{right:4vw;width:108px;height:210px}.tired-worker{transform:scale(.82);transform-origin:bottom}.boot-caption{margin-bottom:3vh}}@media(prefers-reduced-motion:reduce){.workday-door,.tired-worker,.tired-worker *{animation:none!important}.tired-worker{left:45%}}
    </style>
</head>
<body>

    <!-- شاشة التحميل ظاهرة فورًا من الـ HTML نفسه قبل ما الـ JS
         حتى يشتغل، عشان أول حاجة تتشاف تكون اللوجو مش صفحة فاضية. -->
    <div id="bootLoader" aria-live="polite" aria-label="Loading Operation System">
      <div class="workday-scene">
        <div class="workday-sky"></div><div class="workday-city"></div><div class="workday-office"></div><div class="workday-door"></div>
        <div class="tired-worker"><span class="head"></span><span class="body"></span><span class="leg a"></span><span class="leg b"></span><span class="bag"></span></div>
        <div class="boot-caption"><strong>Starting the workday…</strong><small id="bootStatus">Walking into the workspace with the laptop bag.</small><div class="boot-progress"><i id="bootProgress"></i></div></div>
      </div>
    </div>
    <script>
      (()=>{try{document.documentElement.dataset.theme=localStorage.getItem('operation_theme')||'genius'}catch{}const bar=document.getElementById('bootProgress'),status=document.getElementById('bootStatus');const stages=[['Getting through the door…',30],['Opening the laptop…',55],['Checking today’s workspace…',78],['Ready for work.',96]];let i=0;window.__operationBootTimer=setInterval(()=>{if(i>=stages.length){clearInterval(window.__operationBootTimer);return}status.textContent=stages[i][0];bar.style.width=stages[i][1]+'%';i++},700)})();
    </script>

    <div id="app"></div>

    <script type="module" src="./assets/js/core/app.js"></script>
</body>
</html>
