<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toledo Operation System</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ستايل شاشة التحميل مكتوب inline هنا (مش في ملف الثيم) عشان
         يتطبق فورًا من أول رسمة للصفحة، قبل ما الجافاسكريبت يشتغل
         ويحمّل ملف الثيم ديناميكيًا. كده مفيش "ومضة" شكل بايظ. -->
    <style>
        #bootLoader{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:radial-gradient(circle at 18% 18%,rgba(210,48,38,.22),transparent 30%),radial-gradient(circle at 82% 22%,rgba(232,179,76,.16),transparent 30%),linear-gradient(145deg,#110d0c,#241714 58%,#120e0d);transition:opacity .55s ease,visibility .55s ease;overflow:hidden}
        #bootLoader::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 180deg,transparent,rgba(255,238,194,.07),transparent 38%);animation:bootAura 8s linear infinite}
        #bootLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}.boot-panel{position:relative;width:min(460px,calc(100vw - 34px));padding:42px 38px 34px;border-radius:34px;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,236,194,.20);box-shadow:0 36px 110px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(26px)}
        .boot-mark{width:94px;height:94px;margin:0 auto 24px;border-radius:27px;padding:5px;background:linear-gradient(145deg,#f5dfaa,#9d251d);box-shadow:0 24px 60px rgba(0,0,0,.36)}.boot-logo-img{width:100%;height:100%;object-fit:cover;border-radius:22px}.boot-brand{font-family:'Cinzel',serif;font-size:31px;font-weight:700;color:#fff1c9;letter-spacing:9px;margin-left:9px}.boot-brand-sub{font:600 11px 'Raleway',sans-serif;color:rgba(255,255,255,.54);letter-spacing:5px;text-transform:uppercase;margin:8px 0 31px}
        .boot-progress-track{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.06)}.boot-progress-bar{height:100%;width:14%;border-radius:inherit;background:linear-gradient(90deg,#9d251d,#d73526,#f3cf7d);box-shadow:0 0 24px rgba(243,207,125,.42);transition:width .5s ease}.boot-status{margin-top:15px;min-height:18px;color:rgba(255,241,201,.78);font:600 12px 'Inter',sans-serif;letter-spacing:.2px}.boot-steps{display:flex;justify-content:center;gap:7px;margin-top:21px}.boot-step{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.13)}.boot-step.active{background:#f3cf7d;box-shadow:0 0 14px rgba(243,207,125,.65)}
        @keyframes bootAura{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#bootLoader::before{animation:none}}
    </style>
</head>
<body>

    <!-- شاشة التحميل ظاهرة فورًا من الـ HTML نفسه قبل ما الـ JS
         حتى يشتغل، عشان أول حاجة تتشاف تكون اللوجو مش صفحة فاضية. -->
    <div id="bootLoader">
        <div class="boot-panel">
            <div class="boot-mark"><img src="https://i.ibb.co/FLnH6Fw2/1cf98fc6-5c25-4af8-8af0-1e556340272f.jpg" class="boot-logo-img" alt="Toledo"></div>
            <div class="boot-brand">TOLEDO</div>
            <div class="boot-brand-sub">Operation System</div>
            <div class="boot-progress-track"><div id="bootProgress" class="boot-progress-bar"></div></div>
            <div id="bootStatus" class="boot-status">Preparing secure workspace…</div>
            <div class="boot-steps"><i class="boot-step active"></i><i class="boot-step"></i><i class="boot-step"></i><i class="boot-step"></i></div>
        </div>
    </div>

    <div id="app"></div>

    <script>
      (()=>{const b=document.getElementById('bootProgress'),t=document.getElementById('bootStatus'),d=[['Loading interface…',36],['Connecting services…',61],['Preparing your workspace…',84],['Almost ready…',94]];let i=0;window.__toledoBootTimer=setInterval(()=>{if(i>=d.length)return clearInterval(window.__toledoBootTimer);t.textContent=d[i][0];b.style.width=d[i][1]+'%';document.querySelectorAll('.boot-step').forEach((x,n)=>x.classList.toggle('active',n<=i));i++;},650)})();
    </script>
    <script type="module" src="./assets/js/core/app.js"></script>
</body>
</html>
