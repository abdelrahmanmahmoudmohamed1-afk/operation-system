<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation System</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- ستايل شاشة التحميل مكتوب inline هنا (مش في ملف الثيم) عشان
         يتطبق فورًا من أول رسمة للصفحة، قبل ما الجافاسكريبت يشتغل
         ويحمّل ملف الثيم ديناميكيًا. كده مفيش "ومضة" شكل بايظ. -->
    <style>
        :root{--boot-accent:#f0c76a;--boot-deep:#0b0908}
        #bootLoader{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(240,199,106,.10),transparent 30%),linear-gradient(145deg,#090706,#17110f 58%,#0a0807);transition:opacity .48s ease,visibility .48s ease}
        #bootLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .boot-grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at center,#000 18%,transparent 72%)}
        .boot-shell{position:relative;width:min(380px,calc(100vw - 30px));padding:34px 30px 28px;text-align:center;border:1px solid rgba(255,241,201,.14);border-radius:30px;background:rgba(255,255,255,.045);box-shadow:0 30px 100px rgba(0,0,0,.40);backdrop-filter:blur(24px)}
        .boot-logo-stage{position:relative;width:116px;height:116px;margin:0 auto 20px;display:grid;place-items:center}
        .boot-ring{position:absolute;inset:0;border-radius:32px;border:1px solid rgba(240,199,106,.22);animation:bootPulse 1.8s ease-in-out infinite}
        .boot-ring::before{content:"";position:absolute;inset:9px;border-radius:25px;border:1px solid rgba(255,255,255,.08)}
        .boot-logo-frame{position:relative;width:92px;height:92px;border-radius:24px;overflow:hidden;background:#111;box-shadow:0 18px 48px rgba(0,0,0,.38)}
        .boot-logo-img{width:100%;height:100%;object-fit:cover;display:block;clip-path:inset(100% 0 0 0);animation:bootLogoBuild 1.55s cubic-bezier(.2,.8,.2,1) forwards}
        .boot-scan{position:absolute;left:8px;right:8px;height:2px;top:8px;background:linear-gradient(90deg,transparent,var(--boot-accent),transparent);box-shadow:0 0 18px rgba(240,199,106,.72);animation:bootScan 1.55s cubic-bezier(.2,.8,.2,1) forwards}
        .boot-brand{font:600 19px 'Inter',sans-serif;color:#fff1c9;letter-spacing:.7px;margin-bottom:4px}
        .boot-brand-sub{font:500 11px 'Inter',sans-serif;color:rgba(255,255,255,.48);letter-spacing:.25px;margin-bottom:22px}
        .boot-progress{height:4px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
        .boot-progress>i{display:block;height:100%;width:14%;border-radius:inherit;background:linear-gradient(90deg,#9a2b22,#d73526,var(--boot-accent));transition:width .42s ease}
        .boot-status{min-height:18px;margin-top:12px;color:rgba(255,241,201,.65);font:500 11px 'Inter',sans-serif}
        @keyframes bootLogoBuild{to{clip-path:inset(0 0 0 0)}}
        @keyframes bootScan{0%{top:8px;opacity:0}10%{opacity:1}92%{opacity:1}100%{top:100px;opacity:0}}
        @keyframes bootPulse{0%,100%{transform:scale(.98);opacity:.55}50%{transform:scale(1.03);opacity:1}}
        @media(max-width:560px){.boot-shell{padding:30px 22px 24px;border-radius:24px}.boot-logo-stage{width:108px;height:108px}}
        @media(prefers-reduced-motion:reduce){.boot-ring,.boot-logo-img,.boot-scan{animation:none}.boot-logo-img{clip-path:none}.boot-scan{display:none}}
    </style>
</head>
<body>

    <!-- شاشة التحميل ظاهرة فورًا من الـ HTML نفسه قبل ما الـ JS
         حتى يشتغل، عشان أول حاجة تتشاف تكون اللوجو مش صفحة فاضية. -->
    <div id="bootLoader" aria-live="polite" aria-label="Loading Operation System">
        <div class="boot-grid"></div>
        <div class="boot-shell">
            <div class="boot-logo-stage">
                <div class="boot-ring"></div>
                <div class="boot-logo-frame">
                    <img src="https://i.ibb.co/FLnH6Fw2/1cf98fc6-5c25-4af8-8af0-1e556340272f.jpg" class="boot-logo-img" alt="Company logo">
                    <span class="boot-scan"></span>
                </div>
            </div>
            <div class="boot-brand">Operation System</div>
            <div class="boot-brand-sub">Secure workspace</div>
            <div class="boot-progress"><i id="bootProgress"></i></div>
            <div id="bootStatus" class="boot-status">Preparing interface…</div>
        </div>
    </div>

    <script>
      (()=>{
        const bar=document.getElementById('bootProgress');
        const status=document.getElementById('bootStatus');
        const stages=[['Loading interface…',36],['Connecting services…',61],['Preparing workspace…',84],['Almost ready…',95]];
        let i=0;
        window.__operationBootTimer=setInterval(()=>{
          if(i>=stages.length){clearInterval(window.__operationBootTimer);return;}
          status.textContent=stages[i][0];bar.style.width=stages[i][1]+'%';i++;
        },650);
      })();
    </script>

    <div id="app"></div>

    <script type="module" src="./assets/js/core/app.js"></script>
</body>
</html>
