<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toledo Operation System</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ستايل شاشة التحميل مكتوب inline هنا (مش في ملف الثيم) عشان
         يتطبق فورًا من أول رسمة للصفحة، قبل ما الجافاسكريبت يشتغل
         ويحمّل ملف الثيم ديناميكيًا. كده مفيش "ومضة" شكل بايظ. -->
    <style>
        #bootLoader {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, rgba(201,162,39,.14), transparent 34%),
                linear-gradient(135deg, #1D232C, #0E1116);
            transition: opacity .6s ease;
        }
        #bootLoader.hidden { opacity: 0; pointer-events: none; }
        .boot-brand {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 30px;
            font-weight: 700;
            color: #ECEEF1;
            letter-spacing: 10px;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 40px rgba(201,162,39,.5);
        }
        .boot-brand-sub {
            font-family: 'Raleway', Arial, sans-serif;
            font-size: 11px;
            font-weight: 300;
            color: rgba(236,238,241,.62);
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 48px;
        }
        .boot-emblem { position: relative; width: 140px; height: 140px; margin: 0 auto 32px; }
        .boot-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #C9A227;
            border-right-color: #E7DDD0;
            animation: bootRingRotate 1.8s cubic-bezier(.68,-.55,.27,1.55) infinite;
        }
        .boot-ring-2 {
            inset: 14px;
            border-top-color: transparent;
            border-bottom-color: #8A7B65;
            border-left-color: #C9A227;
            animation: bootRingRotate 2.4s linear infinite reverse;
        }
        .boot-ring-3 { inset: 28px; border: 1px solid rgba(201,162,39,.15); animation: none; }
        .boot-logo-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .boot-logo-img { width: 88px; height: 88px; object-fit: cover; border-radius: 50%; box-shadow: 0 16px 40px rgba(0,0,0,.32); }
        @keyframes bootRingRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .boot-divider { width: 120px; height: 1px; background: linear-gradient(90deg, transparent, #C9A227, transparent); margin: 24px auto; }
        .boot-dots { display: flex; gap: 8px; justify-content: center; }
        .boot-dot { width: 5px; height: 5px; border-radius: 50%; background: #C9A227; opacity: .2; animation: bootDotPulse 1.4s ease-in-out infinite; }
        .boot-dot:nth-child(1) { animation-delay: 0s; }
        .boot-dot:nth-child(2) { animation-delay: .2s; }
        .boot-dot:nth-child(3) { animation-delay: .4s; }
        .boot-dot:nth-child(4) { animation-delay: .6s; }
        .boot-dot:nth-child(5) { animation-delay: .8s; }
        @keyframes bootDotPulse { 0%,100% { opacity:.15; transform:scale(1); } 50% { opacity:1; transform:scale(1.5); background:#E7DDD0; } }
        @media (prefers-reduced-motion: reduce) { .boot-ring, .boot-ring-2, .boot-dot { animation: none; } }
    </style>
</head>
<body>

    <!-- شاشة التحميل ظاهرة فورًا من الـ HTML نفسه قبل ما الـ JS
         حتى يشتغل، عشان أول حاجة تتشاف تكون اللوجو مش صفحة فاضية. -->
    <div id="bootLoader">
        <div class="boot-brand">TOLEDO</div>
        <div class="boot-brand-sub">Operation System</div>

        <div class="boot-emblem">
            <div class="boot-ring"></div>
            <div class="boot-ring boot-ring-2"></div>
            <div class="boot-ring boot-ring-3"></div>
            <div class="boot-logo-center">
                <img src="https://i.ibb.co/FLnH6Fw2/1cf98fc6-5c25-4af8-8af0-1e556340272f.jpg" class="boot-logo-img" alt="Toledo">
            </div>
        </div>

        <div class="boot-divider"></div>

        <div class="boot-dots">
            <div class="boot-dot"></div>
            <div class="boot-dot"></div>
            <div class="boot-dot"></div>
            <div class="boot-dot"></div>
            <div class="boot-dot"></div>
        </div>
    </div>

    <div id="app"></div>

    <script type="module" src="./assets/js/core/app.js"></script>
</body>
</html>
