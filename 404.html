<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting…</title>
  <script>
    (function () {
      var repoBase = '/operation-system/';
      var target = repoBase;
      if (location.pathname.startsWith(repoBase)) {
        var route = location.pathname.slice(repoBase.length).replace(/^\/+|\/+$/g, '');
        if (route) target += '#' + encodeURIComponent(route.split('/')[0]);
      }
      location.replace(target);
    }());
  </script>
</head>
<body>Redirecting…</body>
</html>
